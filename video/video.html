<!doctype html><meta charset="utf-8">
<!-- OreSat demo video (Simantic video kit). ./make.sh fetches the kit into .kit/, writes data.js from runs/ and
     renders oresat-demo.mp4. Open this page in a browser to play it; ?t=30 holds a frame. -->
<link rel="stylesheet" href=".kit/assets/base.css"><link rel="stylesheet" href=".kit/assets/video.css">
<style>
.ob { padding: 16px 22px; } .ob .k { font: 500 17px var(--mono); color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.ob .v { font: 500 28px/1.25 var(--sans); margin-top: 4px; } .ob .s { font: 400 20px/1.3 var(--sans); color: var(--muted); margin-top: 3px; }
.osim { border: 2px dashed var(--sim); border-radius: 6px; background: #e4efec; } .osim .k { color: var(--sim); }
.olegend { font: 400 21px var(--sans); color: var(--muted); display: flex; gap: 34px; }
.olegend span { display: flex; align-items: center; gap: 10px; } .olegend i { width: 22px; height: 14px; border-radius: 3px; display: block; }
.vals { padding: 18px 24px; } .vals h3 { font: 500 17px var(--mono); color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 8px; }
.vrow { display: flex; justify-content: space-between; font: 400 22px/1.65 var(--mono); border-bottom: 1px solid var(--line); }
.vrow b { font-weight: 500; } .vrow span { color: var(--muted); }
</style>
<body>
<script src="data.js"></script><script src=".kit/assets/video.js"></script>
<script>
const D = window.DATA;   // every number on screen comes from data.js (collect.py, from the recorded run)
const NODES = [["12", "solar card", "0x0C"], ["4", "battery card", "0x04"]];
const LANES = [["c3", "C3 master"], ...NODES.map(([n, name, id]) => [n, `${name} ${id}`])];
const reads = D.sdo.filter(s => s.op == "read"), write = D.sdo.find(s => s.op == "write");
const P = D.pdo_resumed;
const pretty = l => l.replace("reported_state_of_charge", "state of charge").replace(/[._]/g, " ");
const unit = u => u == "C" ? "°C" : u;
const ms = x => (x * 1000).toFixed(1);

// The bus timeline, kept sparse: heartbeats, and only the commands the scene is about.
const tlHTML = p => `<svg class="abs" id="${p}-tl" style="left:0;top:20px" width="1760" height="460"></svg>`;
function drawTL(p, w0, w1, vt, mark = {}) {
  const X0 = 300, X1 = 1740, x = t => X0 + (t - w0) / (w1 - w0) * (X1 - X0), ly = i => 50 + i * 150, on = t => t >= w0 && t <= Math.min(vt, w1);
  const T = (xx, y, txt, o = "") => `<text class="m" x="${xx}" y="${y}" font-family="var(--mono)" font-size="20" ${o}>${txt}</text>`;
  let g = "";
  LANES.forEach(([k, name], i) => g += T(0, ly(i) + 7, name, 'fill="#111"').replace('class="m"', "") + `<line x1="${X0}" y1="${ly(i)}" x2="${X1}" y2="${ly(i)}" stroke="#d9d9d3" stroke-width="2"/>`);
  for (let s = Math.ceil(w0); s <= w1; s++) g += T(x(s), ly(2) + 70, `${s} s`, 'fill="#8a8a84" text-anchor="middle" font-size="18"').replace('class="m"', '');
  NODES.forEach(([n], i) => D.heartbeats[n].forEach(([t, st]) => {
    if (!on(t)) return;
    const X = x(t), y = ly(i + 1);
    if (st == 0) g += `<circle class="m" cx="${X}" cy="${y}" r="13" fill="var(--sim)"/>` + T(X + 22, y - 22, `boot-up ${ms(t)} ms`, 'fill="#111"');
    else g += `<rect class="m" x="${X - 4}" y="${y - 20}" width="8" height="40" rx="1" ${st == 4 ? 'fill="#fff" stroke="#8a8a84" stroke-width="2"' : 'fill="#111"'}/>`;
  }));
  const cmd = (t, label, lane) => { if (!on(t)) return;
    g += `<rect class="m" x="${x(t) - 11}" y="${ly(0) - 11}" width="22" height="22" transform="rotate(45 ${x(t)} ${ly(0)})" fill="var(--sim)"/>` + T(x(t) + 22, ly(0) - 18, label, 'fill="var(--sim)"')
       + `<line x1="${x(t)}" y1="${ly(0) + 16}" x2="${x(t)}" y2="${ly(lane) - 26}" stroke="var(--sim)" stroke-width="2" stroke-dasharray="6 6"/>`; };
  if (mark.write) cmd(write.t, `SDO write: heartbeat ${write.value} ms`, 1);
  if (mark.nmt) D.nmt.forEach(m => cmd(m.t, `NMT ${m.cmd}`, 1));
  if (mark.pdo && on(P.t)) g += `<line x1="${x(P.t)}" y1="${ly(1) - 46}" x2="${x(P.t)}" y2="${ly(1) - 24}" stroke="var(--sim)" stroke-width="2"/><rect class="m" x="${x(P.t) - 40}" y="${ly(1) - 92}" width="80" height="44" rx="4" fill="#e4efec" stroke="var(--sim)" stroke-width="2"/>`
       + T(x(P.t), ly(1) - 63, "PDO", 'fill="var(--sim)" text-anchor="middle"').replace('class="m"', "");
  (mark.gaps || []).forEach(([t0, t1, txt]) => { if (on(t1)) g += `<path d="M${x(t0)},${ly(1) + 34} v8 H${x(t1)} v-8" fill="none" stroke="var(--sim)" stroke-width="2"/>` + T((x(t0) + x(t1)) / 2, ly(1) + 70, txt, 'fill="var(--sim)" text-anchor="middle"'); });
  $(`#${p}-tl`).innerHTML = g;
  // no two marks or labels may overlap on any frame: render.py stops on this error
  const bs = [...$(`#${p}-tl`).querySelectorAll(".m")].map(e => [e, e.getBBox()]);
  for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
    const [ea, a] = bs[i], [eb, b] = bs[j];
    if (a.x < b.x + b.width - 1 && b.x < a.x + a.width - 1 && a.y < b.y + b.height - 1 && b.y < a.y + a.height - 1)
      throw new Error(`timeline overlap in ${p} at vt=${vt.toFixed(3)}: ${ea.outerHTML.slice(0, 80)} / ${eb.outerHTML.slice(0, 80)}`);
  }
}
const sweep = (t, a, w0, w1, d) => lerp(w0, w1, prog(t, a + 0.5, a + d));

const cutaway = `<svg class="abs" style="left:0;top:10px" width="520" height="640">
  <rect x="30" y="10" width="420" height="560" rx="10" fill="#e4efec" stroke="var(--sim)" stroke-width="2" stroke-dasharray="8 6"/>
  <g stroke="#111" stroke-width="2" fill="#fff">${[0,1,2,3].map(i => `<rect x="80" y="${60 + i * 125}" width="260" height="80" rx="4"/>`).join("")}</g>
  <line x1="390" y1="50" x2="390" y2="530" stroke="var(--sim)" stroke-width="6"/>
  ${[0,1,2,3].map(i => `<line x1="340" y1="${100 + i * 125}" x2="390" y2="${100 + i * 125}" stroke="var(--sim)" stroke-width="3"/>`).join("")}
  ${["C3 master (script)", "solar card", "battery card", "protocard"].map((n, i) => `<text x="210" y="${108 + i * 125}" font-family="var(--sans)" font-size="24" text-anchor="middle" fill="#111">${n}</text>`).join("")}
  <text x="402" y="565" font-family="var(--mono)" font-size="18" fill="var(--sim)">CAN</text>
  <text x="30" y="605" font-family="var(--sans)" font-size="17" fill="#8a8a84">illustration</text></svg>`;

Video({
  title: "OreSat0.5 flight firmware on a simulated CAN bus",
  logo: ".kit/assets/logo-full.svg",
  steps: [["setup", "Setup"], ["boot", "Boot"], ["telemetry", "Telemetry"], ["config", "Reconfigure"], ["nmt", "Restart"]],
  scenes: [
    { key: "title", from: 0, to: 3.5,
      html: `<div class="center title" style="bottom:120px"><h1>A CubeSat's flight cards,<br>on a simulated bus</h1><p>Portland State's OreSat0.5 card firmware, unmodified, on simulated STM32F091s.</p></div>
        <svg class="abs" style="left:280px;top:520px" width="1200" height="170" id="ti-orb">
          <path d="M0,170 Q600,-30 1200,170" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="5 7"/>
          <path d="M120,170 Q600,60 1080,170" fill="#fff" stroke="#111" stroke-width="2"/>
          <text x="600" y="155" font-family="var(--sans)" font-size="22" text-anchor="middle" fill="#111">Earth</text>
          <text x="1200" y="40" font-family="var(--sans)" font-size="17" text-anchor="end" fill="#8a8a84">illustration</text>
          <g id="ti-sat"><rect x="-12" y="-12" width="24" height="24" rx="2" fill="var(--sim)" stroke="#111" stroke-width="1.5"/></g></svg>`,
      draw(t, a, e) {
        appear($("h1", e), t, a + 0.2, 0.6); appear($("p", e), t, a + 0.7, 0.6); appear($("#ti-orb"), t, a + 1.0, 0.6);
        const u = 0.15 + 0.7 * prog(t, a, a + 3.5), bx = 1200 * u, by = Math.pow(1 - u, 2) * 170 + 2 * u * (1 - u) * -30 + u * u * 170;
        $("#ti-sat").setAttribute("transform", `translate(${bx} ${by}) rotate(${t * 20})`);
      } },

    { key: "setup", from: 3.5, to: 9.5, step: "setup",
      caption: ["Setup", "Real card firmware. Everything around it is simulated.", "The chips, the sensors, and the C3 computer, played by a script."],
      html: cutaway + `
        ${[["solar card", "0x0C", "INA226 power monitor, 2× TMP101"], ["battery card", "0x04", "2× MAX17205 fuel gauge"], ["protocard", "0x30", "no sensors"]]
          .map(([n, id, s], i) => `<div class="abs osim ob" style="left:600px;top:${20 + i * 160}px;width:1160px;height:130px" id="se-c${i}">
             <div class="k">STM32F091 · simulated · node ${id}</div>
             <div class="card ob" style="position:absolute;left:22px;top:48px;width:420px;padding:10px 16px"><div class="v" style="margin:0;font-size:25px">${n} firmware</div></div>
             <div class="s" style="position:absolute;left:470px;top:60px">${s}</div></div>`).join("")}`,
      draw(t, a) { for (let i = 0; i < 3; i++) appear($("#se-c" + i), t, a + 0.5 + i * 0.4); } },

    { key: "boot", from: 9.5, to: 14.5, step: "boot",
      caption: ["Boot", "Each card boots and announces itself on the bus.", "Then a heartbeat every second: I am alive."],
      html: tlHTML("bo"),
      draw(t, a) { drawTL("bo", 0, 2.6, sweep(t, a, 0, 2.6, 3.8)); } },

    { key: "telemetry", from: 14.5, to: 20.5, step: "telemetry",
      caption: ["Telemetry", "The master reads each card's telemetry over CANopen.", "Every value is the firmware's own reply."],
      html: `${["Solar card", "Battery card"].map((h, i) => `<div class="abs card stack vals" style="left:${i * 900}px;top:20px;width:860px" id="te-${i}"><h3>${h}</h3><div id="te-r${i}"></div></div>`).join("")}`,
      draw(t, a) {
        const order = reads.filter(s => s.label != "device_type" && s.label != "producer_heartbeat_time" && s.t < 5);
        const vt = lerp(order[0].t_reply, order[order.length - 1].t_reply, prog(t, a + 0.5, a + 4.2));
        const row = s => `<div class="vrow"><span>${pretty(s.label)}</span><b>${s.value} ${unit(s.unit)}</b></div>`;
        $("#te-r0").innerHTML = order.filter(s => s.node == 12 && s.t_reply <= vt).map(row).join("");
        $("#te-r1").innerHTML = order.filter(s => s.node == 4 && s.t_reply <= vt).map(row).join("");
      } },

    { key: "config", from: 20.5, to: 26.5, step: "config",
      caption: ["Reconfigure", `One write changes the solar heartbeat: ${D.gaps_before[0]} → ${write.value} ms.`, "The card applies it at once."],
      html: tlHTML("cf"),
      draw(t, a) {
        const hb = D.heartbeats["12"].map(h => h[0]), i0 = hb.findIndex(x => x > write.t_reply);
        drawTL("cf", 4.3, 7.9, sweep(t, a, 4.3, 7.9, 4.6), { write: true,
               gaps: [[hb[i0 - 1], hb[i0], `${D.gaps_before[0]} ms`], [hb[i0 + 1], hb[i0 + 2], `${D.gaps_after[0]} ms`]] });
      } },

    { key: "nmt", from: 26.5, to: 32.5, step: "nmt",
      caption: ["Restart", "The master stops the solar card, then starts it.",
        (t, a) => t < a + 3.2 ? "Stopped, it still beats (hollow) but sends no telemetry." : `Restarted, its telemetry is back: ${D.pdo_resumed_values.join(" · ")}.`],
      html: tlHTML("nm"),
      draw(t, a) { drawTL("nm", 7.6, 10.9, sweep(t, a, 7.6, 10.9, 4.6), { nmt: true, pdo: true }); } },

    { key: "end", from: 32.5, to: 35.5,
      html: `<div class="center end" style="bottom:-100px"><img src=".kit/assets/logo-full.svg"><p>Real firmware. Simulated hardware.</p><div class="u">simantic.com</div></div>`,
      draw(t, a, e) { appear($("img", e), t, a + 0.2, 0.6); appear($("p", e), t, a + 0.6, 0.6); appear($(".u", e), t, a + 1.0, 0.6); } },
  ],
});
</script>
</body>
